[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yap-dictation"
version = "0.1.20"
description = "Free, offline-first, cross-platform voice dictation — speak anywhere, get text at your cursor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.14"
authors = [{ name = "yap contributors" }]
keywords = ["dictation", "speech-to-text", "whisper", "voice", "accessibility", "wispr"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core runtime deps. The local engine pulls faster-whisper; cloud-only users
# can skip it but it's small enough to keep as default.
dependencies = [
    "certifi>=2024.2.2",
    "numpy>=1.21",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
# Nicer cross-platform clipboard; native CLIs are used as a fallback otherwise.
clipboard = ["pyperclip>=1.8"]
# macOS menu-bar app (`yap app`). AVFoundation is used to explicitly request the
# Microphone grant (CoreAudio stream-open doesn't reliably prompt for our app).
macos = ["rumps>=0.4.0; sys_platform == 'darwin'", "parakeet-mlx>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'", "pyobjc-framework-AVFoundation>=9.0; sys_platform == 'darwin'"]
# Parakeet speech model. On Apple Silicon this is the fast GPU engine (picked
# automatically); elsewhere it's the cross-platform ONNX build (opt in with
# `yap config set local.backend '"parakeet"'`).
parakeet = ["parakeet-mlx>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'", "onnx-asr[cpu,hub]>=0.12; sys_platform != 'darwin' or platform_machine != 'arm64'"]
# OS-appropriate icon shaping for `yap icon`.
icons = ["pillow>=9.0"]
# Everything for the best desktop experience.
full = ["pyperclip>=1.8", "parakeet-mlx>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'", "pillow>=9.0", "rumps>=0.4.0; sys_platform == 'darwin'", "pyobjc-framework-AVFoundation>=9.0; sys_platform == 'darwin'", "pystray>=0.19.4; sys_platform != 'darwin'"]

[project.scripts]
yap = "yap.cli:main"

[project.urls]
Homepage = "https://github.com/AkuchiS/Yap"
Issues = "https://github.com/AkuchiS/Yap/issues"

[tool.setuptools.packages.find]
include = ["yap*"]

[tool.setuptools.package-data]
# ship the self-test clip inside the wheel so `yap selftest` works from a pip/pipx install
yap = ["assets/*.wav"]
